{% extends "base.html" %}{% block content %}
<header class="pro-game-head"><a href="/games" class="game-back">‹</a><div><h1>تحدي السرعة</h1><p>لاعبين · أول واحد يوصل 30 يفوز</p></div><span>⚡</span></header>
<section class="tap-shell"><div id="players" class="tap-players"></div>
<div class="tap-arena"><div class="tap-score"><b id="myScore">0</b><small>نقاطك</small></div><button id="hit" class="tap-button">اضغط!</button><div class="tap-score"><b id="otherScore">0</b><small>الخصم</small></div></div>
<div class="tap-bars"><div><span id="myBar"></span></div><div><span id="otherBar"></span></div></div>
<div id="resultCard" class="result-card" hidden><b id="resultText"></b><button id="rematchBtn" class="primary">↻ إعادة اللعب</button></div></section>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script>
const gid={{g.id}};let cur=null;const E=x=>document.getElementById(x);
async function load(){let r=await fetch('/api/table-game/'+gid,{cache:'no-store'});if(!r.ok)return;cur=await r.json();let s=cur.state,me=cur.you??0,op=me?0:1;E('players').textContent=cur.players.join('  VS  ');E('myScore').textContent=s.scores[me]||0;E('otherScore').textContent=s.scores[op]||0;E('myBar').style.width=((s.scores[me]||0)/s.target*100)+'%';E('otherBar').style.width=((s.scores[op]||0)/s.target*100)+'%';E('hit').disabled=cur.spectator||cur.status!=='active';if(cur.status==='finished'){E('resultCard').hidden=false;E('resultText').textContent='الفائز: '+cur.players[s.winner]}else E('resultCard').hidden=true}
E('hit').onclick=async()=>{E('hit').classList.add('pop');setTimeout(()=>E('hit').classList.remove('pop'),80);await fetch(`/table-game/${gid}/tap-race`,{method:'POST'});load()};E('rematchBtn').onclick=async()=>{await fetch(`/table-game/${gid}/rematch`,{method:'POST'});load()};try{let s=io();s.emit('join_table',{game_id:gid});s.on('table_state',x=>{if(x.game_id===gid)load()})}catch(e){}load();
</script>{% endblock %}
