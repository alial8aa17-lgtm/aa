{% extends 'base.html' %}{% block content %}<h1>المسابقة الجماعية</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}<div class="grid"><section class="card"><h2>إنشاء مسابقة</h2><form method="post" action="/quiz/create"><input name="title" placeholder="اسم المسابقة" required><label>وقت كل سؤال بالثواني</label><input type="number" name="time_limit" min="5" max="300" value="30" required><button>إنشاء</button></form><h3>مسابقاتي</h3>{% for q in mine %}<p><a class="btn ghost" href="/quiz/{{q.id}}/edit">{{q.title}} · {{q.code}}</a></p>{% endfor %}</section><section class="card"><h2>دخول بكود</h2><form method="post" action="/quiz/join"><input name="code" placeholder="مثال AB12CD" required><button>دخول الغرفة</button></form></section></div>{% endblock %}
