{% extends 'base.html' %}{% block content %}
<header class="pro-game-head">
 <a href="/games" class="game-back">‹</a>
 <div><h1>{{'طاولي' if g.kind=='backgammon' else 'دومنة'}} <small>#{{g.id}}</small></h1><p id="roomStatus"></p></div>
 <span class="game-mark">{{'🎲' if g.kind=='backgammon' else '◫'}}</span>
</header>
<section class="pro-game-stage">
 <div id="resultCard" class="result-card" hidden><b id="resultText"></b><button id="rematchBtn" class="primary">↻ إعادة اللعب</button><small id="rematchState"></small></div>
 {% if g.kind=='backgammon' %}
 <div class="tavla-ui">
  <div class="turn-strip"><b id="turnName"></b><div class="dice-area"><button id="rollBtn">🎲 رمي الزهر</button><span id="diceBox">—</span></div></div>
  <div class="wood-board">
   <div class="board-fold"></div><div id="bgBar" class="bg-bar"></div>
   <button id="off1" class="bg-off off-top"></button><button id="off0" class="bg-off off-bottom"></button>
   <div id="pointsGrid" class="points-grid"></div>
  </div>
  <div class="game-instruction">دوس على حجرك ← الخانات المسموحة تتوهج ← اختار وين تحركه</div>
 </div>
 {% else %}
 <div class="dom-pro">
  <div class="dom-status"><b id="turnName"></b><span id="stockCount"></span></div>
  <div class="felt-table">
   <div id="domPlayers" class="dom-players"></div>
   <div id="domChain" class="snake-chain"></div>
   <button id="leftTarget" class="end-target left-target" hidden>+</button>
   <button id="rightTarget" class="end-target right-target" hidden>+</button>
  </div>
  <div class="your-hand"><small>قطعك</small><div id="domHand" class="dom-rack"></div></div>
  <div class="dom-controls"><button id="drawBtn" class="primary">اسحب</button><button id="passBtn" class="ghost">تمرير</button></div>
 </div>
 {% endif %}
 <div id="gameToast" class="mini-toast"></div>
</section>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const gid={{g.id}},kind='{{g.kind}}';let cur=null,selDom=null,selBG=null,bgOpts=[];
const $=id=>document.getElementById(id);
function toast(x){let e=$('gameToast');e.textContent=x;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1600)}
async function load(){let r=await fetch('/api/table-game/'+gid,{cache:'no-store'});if(!r.ok)return;cur=await r.json();$('roomStatus').textContent=cur.status==='active'?'مباراة مباشرة':cur.status==='finished'?'انتهت الجولة':'بانتظار اللاعبين';kind==='backgammon'?renderBG():renderDom();let rc=$('resultCard');if(cur.status==='finished'){rc.hidden=false;let w=cur.state.winner;$('resultText').textContent='الفائز: '+(cur.players[w]||'—')}else rc.hidden=true}

function checker(cls,n,src){let h='';for(let i=0;i<Math.min(n,5);i++)h+=`<button class="checker ${cls}" data-src="${src}"></button>`;if(n>5)h+=`<b class="checker-count">${n}</b>`;return h}
function renderBG(){let st=cur.state;if(!st.points)return;$('turnName').textContent='الدور: '+cur.players[st.turn];$('diceBox').innerHTML=st.dice?.length?st.dice.map(d=>`<i class="die">${d}</i>`).join(''):'—';
 let h='';for(let i=0;i<24;i++){let n=st.points[i],mine=!cur.spectator&&(cur.you===0?n>0:n<0),legal=bgOpts.some(o=>o.dest===i);h+=`<div class="bg-point ${i<12?'top':'bottom'} ${i%2?'dark':'light'} ${legal?'legal-dest':''}" data-dest="${i}"><div class="checker-stack">${checker(n>0?'ivory':'charcoal',Math.abs(n),mine?i:'x')}</div></div>`}$('pointsGrid').innerHTML=h;
 $('bgBar').innerHTML=checker('ivory',st.bar[0],cur.you===0?-1:'x')+checker('charcoal',st.bar[1],cur.you===1?-1:'x');$('off0').textContent=st.off[0]||'';$('off1').textContent=st.off[1]||'';
 document.querySelectorAll('.checker[data-src]:not([data-src="x"])').forEach(e=>e.onclick=()=>selectBG(+e.dataset.src));document.querySelectorAll('.legal-dest').forEach(e=>e.onclick=()=>moveBG(+e.dataset.dest));
 let off=bgOpts.some(o=>o.dest===-2);$('off0').classList.toggle('legal-off',off&&cur.you===0);$('off1').classList.toggle('legal-off',off&&cur.you===1);if(off)(cur.you===0?$('off0'):$('off1')).onclick=()=>moveBG(-2)
}
async function selectBG(src){if(cur.spectator)return;if(cur.state.turn!==cur.you)return toast('مو دورك');if(!cur.state.dice?.length)return toast('ارمِ الزهر أولاً');let r=await fetch(`/table-game/${gid}/bg-legal/${src}`),x=await r.json();if(!r.ok||!x.options?.length)return toast('هذا الحجر ما عنده حركة مسموحة');selBG=src;bgOpts=x.options;renderBG()}
async function moveBG(dest){let r=await fetch(`/table-game/${gid}/bg-move`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({src:selBG,dest})}),x=await r.json();if(!r.ok)toast(x.error==='illegal_destination'?'هاي الخانة مو مسموحة':'النقلة غير قانونية');selBG=null;bgOpts=[];load()}
if(kind==='backgammon')$('rollBtn').onclick=async()=>{let r=await fetch(`/table-game/${gid}/roll`,{method:'POST'});if(!r.ok)toast('ما تگدر ترمي هسه');load()};

function pips(n){let h='';for(let i=0;i<n;i++)h+='<i></i>';return `<span class="face p${n}">${h}</span>`}
function tile(t,i,disabled=false){return `<button class="pro-domino ${t[0]===t[1]?'dbl':''} ${selDom===i?'selected':''}" data-i="${i}" ${disabled?'disabled':''}>${pips(t[0])}<em></em>${pips(t[1])}</button>`}
function renderDom(){let st=cur.state;if(!st.hand_counts)return;$('turnName').textContent='الدور: '+cur.players[st.turn];$('stockCount').textContent='المخزون '+(st.stock_count??0);$('domPlayers').innerHTML=cur.players.map((p,i)=>`<div class="dom-seat ${st.turn===i?'turn':''}"><b>${p}</b><span>${st.hand_counts[i]} قطع</span></div>`).join('');
 let chain=st.chain||[];$('domChain').innerHTML=chain.length?chain.map((t,i)=>`<div class="chain-piece">${tile(t,0,true)}</div>`).join(''):'<div class="chain-empty">ابدأ أول حجر</div>';
 if(cur.spectator){$('domHand').innerHTML='<b class="watching">👁 مشاهدة مباشرة — القطع مخفية</b>';$('drawBtn').hidden=$('passBtn').hidden=true;return}
 $('domHand').innerHTML=st.hand.map((t,i)=>tile(t,i)).join('');$('domHand').querySelectorAll('.pro-domino').forEach(e=>e.onclick=()=>{selDom=+e.dataset.i;renderDom()});showEnds()}
function showEnds(){if(kind!=='domino'||cur?.spectator)return;let st=cur.state,t=selDom===null?null:st.hand[selDom],ch=st.chain||[],L=false,R=false;if(t){if(!ch)L=R=true;else{L=t.includes(ch[0][0]);R=t.includes(ch[ch.length-1][1])}}$('leftTarget').hidden=!L;$('rightTarget').hidden=!R}
async function playDom(side){if(selDom===null)return;let r=await fetch(`/table-game/${gid}/domino-play`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:selDom,side})}),x=await r.json();if(!r.ok)toast(x.error==='nomatch'?'الحجر ما يركب بهذا الطرف':'الحركة غير مسموحة');selDom=null;load()}
if(kind==='domino'){$('leftTarget').onclick=()=>playDom('left');$('rightTarget').onclick=()=>playDom('right');$('drawBtn').onclick=async()=>{let r=await fetch(`/table-game/${gid}/domino-draw`,{method:'POST'}),x=await r.json();if(!r.ok)toast(x.error==='have_move'?'عندك حجر صالح، لازم تلعبه':x.error==='turn'?'مو دورك':'ماكو سحب');else toast(x.auto_pass?'خلص المخزون ومرّ الدور':`سحبت ${x.drawn} قطعة`);load()};$('passBtn').onclick=async()=>{let r=await fetch(`/table-game/${gid}/domino-pass`,{method:'POST'}),x=await r.json();if(!r.ok)toast(x.error==='have_move'?'عندك حجر صالح':x.error==='draw_first'?'لازم تسحب أولاً':'مو دورك');load()}}
$('rematchBtn').onclick=async()=>{let r=await fetch(`/table-game/${gid}/rematch`,{method:'POST'}),x=await r.json();if(r.ok)$('rematchState').textContent=x.started?'بدأت الجولة':'بانتظار موافقة الباقين';load()};
try{let s=io();s.emit('join_table',{game_id:gid});s.on('table_state',x=>{if(x.game_id===gid)load()})}catch(e){}load();
</script>{% endblock %}
