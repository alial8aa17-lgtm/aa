{% extends 'base.html' %}{% block content %}<header class="chat-head"><a href="/chat">‹</a><img class="head-avatar" src="/static/img/{{other.avatar}}.svg"><div class="head-copy"><h1>{{other.display_name}}</h1><p>@{{other.username}}</p></div></header><section class="messages">{% for m in rows %}<article class="bubble {% if m.from_user_id==me.id %}mine{% endif %} {% if m.system %}system{% endif %}"><div class="bubble-text">{{m.body}}</div><time>{{m.created_at.strftime('%H:%M')}}</time></article>{% endfor %}</section><form method="post" class="composer"><input name="body" placeholder="اكتب رسالة خاصة..." required><button class="send-btn">↑</button></form>{% endblock %}
