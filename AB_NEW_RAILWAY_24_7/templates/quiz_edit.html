{% extends 'base.html' %}{% block content %}<h1>{{quiz.title}}</h1><div class="notice">كود الغرفة: <b style="font-size:24px">{{quiz.code}}</b></div><div class="grid"><section class="card"><h2>إضافة سؤال</h2><form method="post"><textarea name="text" placeholder="السؤال" required></textarea><input name="a" placeholder="الاختيار A" required><input name="b" placeholder="الاختيار B" required><input name="c" placeholder="الاختيار C" required><input name="d" placeholder="الاختيار D" required><select name="correct"><option value="A">الصحيح A</option><option value="B">الصحيح B</option><option value="C">الصحيح C</option><option value="D">الصحيح D</option></select><button>إضافة السؤال</button></form></section><section class="card"><h2>الأسئلة</h2>{% for q in questions %}<p><b>{{loop.index}}. {{q.text}}</b><br><span class="muted">الإجابة الصحيحة {{q.correct}}</span></p>{% else %}<p class="muted">لا توجد أسئلة بعد</p>{% endfor %}</section></div><a class="btn" href="/quiz/{{quiz.id}}">فتح غرفة اللعب</a>{% endblock %}
