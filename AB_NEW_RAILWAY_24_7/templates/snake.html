{% extends 'base.html' %}{% block content %}<header class="page-head"><a href="/games">‹</a><div><h1>سوس</h1><p>اجمع النقاط وحطم رقمك</p></div><span>◉</span></header><section class="snake-wrap"><div class="game-stats"><b>النقاط <span id="score">0</span></b><b>الأفضل <span id="best">0</span></b></div><canvas id="snake" width="320" height="320"></canvas><div class="dpad"><i></i><button data-d="u">↑</button><i></i><button data-d="l">←</button><button data-d="d">↓</button><button data-d="r">→</button></div><button id="restart" class="primary">إعادة اللعب</button></section><script>const c=document.getElementById('snake'),x=c.getContext('2d'),N=16,S=20;let sn,food,dir,score,best=0,t;function reset(){sn=[[8,8],[7,8],[6,8]];food=[12,8];dir=[1,0];score=0;clearInterval(t);t=setInterval(step,140);draw()}function step(){let h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(p=>p[0]==h[0]&&p[1]==h[1])){clearInterval(t);best=Math.max(best,score);document.getElementById('best').textContent=best;return}sn.unshift(h);if(h[0]==food[0]&&h[1]==food[1]){score+=10;food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)];document.getElementById('score').textContent=score}else sn.pop();draw()}function draw(){x.fillStyle='#031326';x.fillRect(0,0,320,320);x.strokeStyle='#0c3156';for(let i=0;i<=16;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,320);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(320,i*S);x.stroke()}x.fillStyle='#28a5ff';sn.forEach(p=>x.fillRect(p[0]*S+2,p[1]*S+2,16,16));x.fillStyle='#ff4e68';x.beginPath();x.arc(food[0]*S+10,food[1]*S+10,7,0,7);x.fill()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let m={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[b.dataset.d];if(m[0]!=-dir[0]||m[1]!=-dir[1])dir=m});document.getElementById('restart').onclick=reset;reset()</script>{% endblock %}
