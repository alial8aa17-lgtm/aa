{% extends 'base.html' %}{% block content %}<header class="page-head"><a href="/games">‹</a><div><h1>سرعة اللمس</h1><p>اضغط الهدف 20 مرة بأسرع وقت</p></div><span>◎</span></header><section class="speed-card"><div class="game-stats"><b>اللمسات <span id="hits">0</span>/20</b><b>الوقت <span id="tm">0.00</span></b></div><div id="arena"><button id="target">●</button></div><div id="result" class="win-banner">اضغط الهدف للبدء</div></section><script>let n=0,start=0,iv;const a=document.getElementById('arena'),b=document.getElementById('target'),h=document.getElementById('hits'),tm=document.getElementById('tm'),r=document.getElementById('result');function pos(){b.style.left=Math.random()*80+'%';b.style.top=Math.random()*78+'%'}b.onclick=()=>{if(!n){start=performance.now();iv=setInterval(()=>tm.textContent=((performance.now()-start)/1000).toFixed(2),30)}n++;h.textContent=n;pos();if(n>=20){clearInterval(iv);let t=((performance.now()-start)/1000).toFixed(2);tm.textContent=t;r.textContent='النتيجة: '+t+' ثانية';b.disabled=true}};pos()</script>{% endblock %}
